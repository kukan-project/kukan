# KUKAN multi-site — ElasticMQ queue definitions (ADR-041)
# Static config: add one pipeline + DLQ block per site, then restart elasticmq.

include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  kukan-citya-pipeline {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "kukan-citya-pipeline-dlq"
      maxReceiveCount = 3
    }
  }

  kukan-citya-pipeline-dlq {
    defaultVisibilityTimeout = 30 seconds
  }

  kukan-cityb-pipeline {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "kukan-cityb-pipeline-dlq"
      maxReceiveCount = 3
    }
  }

  kukan-cityb-pipeline-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
}
