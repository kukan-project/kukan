name: CI

# Lint, typecheck, format check, and unit tests run on every pull request.
#
# `quality` is a REQUIRED status check (see the branch ruleset), so the job must
# always run and report a status — using `paths-ignore` would leave the required
# check pending forever and block the PR. Instead the job always runs but skips
# the code-only steps (lint / typecheck / unit tests) for docs-only PRs. The
# format check still runs because `prettier --check` also covers Markdown and
# Astro. `.astro` files count as docs: @kukan/site has no lint/typecheck/test
# scripts, so the code-only steps never look at them anyway.

# Pushes to develop run the same suite for one reason beyond the extra signal:
# GitHub Actions caches are branch-scoped, and a pull request can only read the
# ones its base branch already has. Without a run on develop, every PR would
# start cold — pnpm store, DuckDB extensions, and turbo alike — and pay the
# download.

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the PR base

      - name: Detect non-docs changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A push to develop has no PR base to diff against, and its job is to
          # leave warm caches behind — so it always runs everything.
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Push to develop — running full quality suite."
            exit 0
          fi
          # A PR is "docs-only" when every changed file is Markdown/MDX/Astro or
          # under docs/. Those still need the format check (prettier covers
          # .md/.mdx/.astro) but not the code-only steps, which don't process
          # .astro at all. merge-base keeps the diff correct if base advanced.
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          files=$(git diff --name-only "$base" "$HEAD_SHA")
          echo "Changed files:"
          echo "$files"
          if printf '%s\n' "$files" | grep -qvE '(\.mdx?$|\.astro$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected — running full quality suite."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change — running format check only."
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # `cache: 'pnpm'` above would be shorter, but it saves the store from
      # whatever branch it runs on and offers no way to say otherwise. Because a
      # cache entry belongs to one ref, that wrote a ~430 MB copy per pull
      # request of a store develop already held byte for byte — the listing had
      # the same key under `refs/heads/develop` and `refs/pull/N/merge` several
      # times over. Twenty of those reached 8.3 GB of the repository's 10 GB,
      # which evicts by least recent use: the DuckDB extensions and the turbo
      # caches were being pushed out by duplicates of themselves.
      #
      # Restoring by hand costs three steps and saves only on develop, where
      # every branch can read the result. The key is the lockfile hash rather
      # than the commit sha, so develop writes a new entry only when a
      # dependency actually moves; a pull request that moves one restores the
      # nearest store by prefix and downloads just the difference.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Save pnpm store
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Turbo keys every task result by an input hash, but the cache lives in
      # `.turbo/cache` and a runner starts empty — so lint, typecheck, and the
      # dependency builds `^build` pulls in have always run from scratch.
      #
      # Only a push to develop saves. Cache entries are immutable and branch
      # scoped: one written on a PR branch is readable by that PR alone, so
      # saving per PR would spend the repository's 10 GB budget — shared with
      # the pnpm store and the DuckDB extensions below — on entries almost
      # nobody reads. develop's are readable from every branch, which is the
      # same reason this workflow runs on `push` at all.
      #
      # The two jobs cache separately. Entries are immutable, so a shared key
      # would collide on a develop push: whichever job saved first wins and the
      # other's contents are dropped. Their contents are not interchangeable —
      # `quality` never builds @kukan/web, because the `^build` behind lint and
      # typecheck builds web's dependencies rather than web itself, which is why
      # its cache measures under 1 MB against `integration`'s ~55 MB.
      - name: Restore turbo cache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-

      - name: Format check
        # No `if:` guard — prettier covers Markdown, so this runs on docs-only PRs too.
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,md,astro}"

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      # `maintenance.ducklake.test.ts` runs against a real DuckLake catalog, so
      # it needs the `ducklake` extension (~35 MB from extensions.duckdb.org).
      # Downloading it inside a test means the download is on the clock of the
      # default 5s timeout, which is how #230 failed. Warm it here instead, and
      # cache the directory so only a cold branch pays for it. The runtime image
      # installs the full set (httpfs/aws/postgres/ducklake) itself — see the
      # Dockerfile — because a closed-network deployment cannot fetch them.
      - name: Cache DuckDB extensions
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('packages/lake/package.json') }}

      - name: Warm DuckDB extensions
        if: steps.changes.outputs.code == 'true'
        # `@duckdb/node-api` is a dependency of @kukan/lake, not of the root.
        working-directory: packages/lake
        run: |
          node --input-type=module -e "
            const { DuckDBInstance } = await import('@duckdb/node-api')
            const conn = await (await DuckDBInstance.create(':memory:')).connect()
            await conn.run('INSTALL ducklake')
          "

      - name: Test (unit only)
        # `test:unit` runs every project except the `*-integration` ones, whose
        # globalSetup connects to Postgres. Those run in `integration` below.
        if: steps.changes.outputs.code == 'true'
        run: pnpm test:unit

      # A restore hands back every entry it held and the save writes them out
      # again alongside the new ones, so without a bound the entry grows by
      # every merge forever. Turbo does not touch an entry's mtime when it hits,
      # so what survives this is an entry nothing has *written* in a week:
      # dropping it costs one rebuild, after which it is saved fresh.
      - name: Prune turbo cache
        if: github.ref == 'refs/heads/develop'
        run: find .turbo/cache -type f -mtime +7 -delete

      - name: Save turbo cache
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}

  # Not part of `quality`, so it is not a required check: it needs a database,
  # and a service container failing should not block a PR the same way a lint
  # error does. It still runs on every code change, which is the point — the raw
  # SQL these suites cover (data-modifying CTEs, the orphan sweep's reference
  # check) is not exercised anywhere else.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kukan
          POSTGRES_PASSWORD: kukan
          POSTGRES_DB: kukan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kukan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # See the quality job for why the store is cached by hand rather than
      # through `cache: 'pnpm'`. This job only reads: the two run the same
      # install from the same lockfile, so the store they would write is
      # identical and `quality` writing it is enough.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-integration-${{ runner.os }}-

      # The worker's suites import `@kukan/api` and `@kukan/db` by their package
      # entry points, which resolve to `dist`.
      #
      # Only those two packages have integration suites, so filtering the build
      # down to them would cut it by two thirds. Don't: this is the one place in
      # pull request CI that runs `next build`. Nothing else does — deploy-site
      # builds only @kukan/site, CodeQL is build-mode none, and the Dockerfile
      # runs in the deploy pipeline. `tsc --noEmit` in `quality` does not stand
      # in for it, since a Next build also rejects server/client boundary
      # violations and invalid route exports. Filtering would skip web exactly
      # when web changed, which is when the check is worth having. The turbo
      # cache above already makes this near-free when web did not change.
      - run: pnpm build

      - name: Test (integration)
        env:
          DATABASE_URL: postgresql://kukan:kukan@localhost:5432/kukan
        run: pnpm test:integration

      # See the quality job for why saving is limited to develop.
      - name: Prune turbo cache
        if: github.ref == 'refs/heads/develop'
        run: find .turbo/cache -type f -mtime +7 -delete

      - name: Save turbo cache
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
