name: CI

# Lint, typecheck, format check, and unit tests run on every pull request.
#
# They sit in two parallel jobs behind a `quality` gate. `quality` is a REQUIRED
# status check (see the branch ruleset) and the ruleset matches on the name, so
# the name stays where it was even though the work moved out of it. What the
# move bought: these steps do not depend on each other and used to run in
# series, and the run's wall clock was whatever `quality` took — taking 90s off
# `integration` once moved the run by five.
#
# Both work jobs must always run and report a status. `paths-ignore` would leave
# the gate waiting on a job that never reports and block the PR forever;
# instead they always run and skip the code-only steps (lint / typecheck / unit
# tests) for docs-only PRs, which the shared `detect-changes` action decides — a
# release's version-only bump of the root package.json counts as one, see the
# action for why. The format check still runs because `prettier --check` also
# covers Markdown and Astro. `.astro` files count as docs: @kukan/site has no
# lint/typecheck/test scripts, so the code-only steps never look at them anyway.

# Pushes to develop run the same suite for one reason beyond the extra signal:
# GitHub Actions caches are branch-scoped, and a pull request can only read the
# ones its base branch already has. Without a run on develop, every PR would
# start cold — pnpm store, DuckDB extensions, and turbo alike — and pay the
# download.

on:
  pull_request:
  push:
    branches: [develop]

# A superseded push to a pull request cancels the run it obsoleted, so the
# newest head is never queued behind a result nobody will read. develop pushes
# are never cancelled: their job is to leave warm caches behind, and each save
# is keyed by its own sha.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `unit`, `integration` and `docker-images` ask for a larger runner through
# `CI_LARGE_RUNNER`. A standard hosted runner is 2 vCPU, and on it the work in
# them does not overlap — vitest's own breakdown summed to 236s against a 260s
# wall in `unit`, and `INTEGRATION_FORKS` in vitest.config.ts, which is a
# connection budget as much as a worker count, collapses to 1. Measured across
# the move to four cores: `unit` 316s to 152s, `integration` 164s to 101s,
# `docker-images` 316s to 218s.
#
# The variable rather than the label, because a larger runner belongs to the
# organization that pays for it, and this file is published to a repository in
# another one. A label that resolves nowhere does not fail the job — it queues
# it, with nothing to say why — so a repository without the runner is left to
# name nothing and get the standard one.
#
# `lint-typecheck` and `web-build` stay on the standard runner. Neither is on the
# critical path (80s and 99s against the others' 218s), so paying twice the rate
# to finish them earlier buys nothing. Larger runners bill outside the included
# minutes at about twice the standard rate, so the arithmetic is that halving a
# job's wall clock leaves its cost roughly where it was.

jobs:
  # The name the branch ruleset requires, and nothing else: the two jobs below
  # hold the work it used to do.
  #
  # `if: always()` is load-bearing. Without it a failed dependency skips this
  # job rather than running it, and GitHub counts a skipped required check as
  # satisfied — the protection would come off exactly when something broke.
  quality:
    needs: [lint-typecheck, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the jobs it stands for
        run: |
          echo "lint-typecheck: ${{ needs.lint-typecheck.result }}"
          echo "unit: ${{ needs.unit.result }}"
          test "${{ needs.lint-typecheck.result }}" = success
          test "${{ needs.unit.result }}" = success

  # Format check, lint, and typecheck. Lint and typecheck stay together because
  # both sit behind turbo's `^build`: apart, each would build the dependency
  # graph for itself.
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the PR base

      # Docs still need the format check (prettier covers .md/.mdx/.astro) but
      # not the code-only steps, which don't process .astro at all.
      - name: Detect non-docs changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          ignore: '(\.mdx?$|\.astro$|^docs/)'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # `cache: 'pnpm'` above would be shorter, but it saves the store from
      # whatever branch it runs on and offers no way to say otherwise. Because a
      # cache entry belongs to one ref, that wrote a ~430 MB copy per pull
      # request of a store develop already held byte for byte — the listing had
      # the same key under `refs/heads/develop` and `refs/pull/N/merge` several
      # times over. Twenty of those reached 8.3 GB of the repository's 10 GB,
      # which evicts by least recent use: the DuckDB extensions and the turbo
      # caches were being pushed out by duplicates of themselves.
      #
      # Restoring by hand costs three steps and saves only on develop, where
      # every branch can read the result. The key is the lockfile hash rather
      # than the commit sha, so develop writes a new entry only when a
      # dependency actually moves; a pull request that moves one restores the
      # nearest store by prefix and downloads just the difference. This is the
      # only job that writes it — every job installs from the same lockfile, so
      # the store each would save is the same one.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Save pnpm store
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Turbo keys every task result by an input hash, but the cache lives in
      # `.turbo/cache` and a runner starts empty — so lint, typecheck, and the
      # dependency builds `^build` pulls in have always run from scratch.
      #
      # Only a push to develop saves. Cache entries are immutable and branch
      # scoped: one written on a PR branch is readable by that PR alone, so
      # saving per PR would spend the repository's 10 GB budget — shared with
      # the pnpm store and the DuckDB extensions in `unit` — on entries almost
      # nobody reads. develop's are readable from every branch, which is the
      # same reason this workflow runs on `push` at all.
      #
      # The jobs cache separately. Entries are immutable, so a shared key
      # would collide on a develop push: whichever job saved first wins and the
      # others' contents are dropped. Their contents are not interchangeable —
      # this job never builds @kukan/web, because the `^build` behind lint and
      # typecheck builds web's dependencies rather than web itself, which is why
      # its cache stays in single-digit MBs while `web-build`'s carries the
      # `.next` output (~130 MB per entry with `.next/cache` excluded — that
      # exclusion is load-bearing: with it in, an entry was 722 MB of mostly
      # turbopack incremental state that a fresh runner never reads).
      - name: Restore turbo cache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-lint-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-lint-typecheck-${{ runner.os }}-

      - name: Format check
        # No `if:` guard — prettier covers Markdown, so this runs on docs-only PRs too.
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,md,astro}"

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      # A restore hands back every entry it held and the save writes them out
      # again alongside the new ones, so without a bound the entry grows by
      # every merge forever. Turbo does not touch an entry's mtime when it hits,
      # so what survives this is an entry nothing has *written* in a week:
      # dropping it costs one rebuild, after which it is saved fresh.
      - name: Prune turbo cache
        if: github.ref == 'refs/heads/develop'
        run: find .turbo/cache -type f -mtime +7 -delete

      - name: Save turbo cache
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-lint-typecheck-${{ runner.os }}-${{ github.sha }}

  # Every suite but the `*-integration` ones, whose globalSetup connects to
  # Postgres; those run in `integration` below. Out of the job above because
  # nothing here waits on lint or typecheck — the two overlap now instead of
  # queueing.
  unit:
    runs-on: ${{ vars.CI_LARGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the PR base

      - name: Detect non-docs changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          ignore: '(\.mdx?$|\.astro$|^docs/)'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.code == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: '24'

      # See `lint-typecheck` for why the store is cached by hand, and why that
      # job is the only one that writes it.
      - name: Locate pnpm store
        id: pnpm-store
        if: steps.changes.outputs.code == 'true'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-unit-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-unit-${{ runner.os }}-

      # The suites import `@kukan/*` by package entry point, which resolves to
      # `dist` everywhere except the web project, which aliases two of them to
      # source — so the packages have to be built. That used to arrive for free
      # from the `^build` behind lint and typecheck. web and site are left out:
      # nothing under test imports either, and `next build` has `web-build` to
      # itself.
      - if: steps.changes.outputs.code == 'true'
        run: pnpm build --filter='!@kukan/web' --filter='!@kukan/site'

      # `maintenance.ducklake.test.ts` runs against a real DuckLake catalog, so
      # it needs the `ducklake` extension (~35 MB from extensions.duckdb.org).
      # Downloading it inside a test means the download is on the clock of the
      # default 5s timeout, which is how #230 failed. Warm it here instead, and
      # cache the directory so only a cold branch pays for it. The runtime image
      # installs the full set (httpfs/aws/postgres/ducklake) itself — see the
      # Dockerfile — because a closed-network deployment cannot fetch them.
      - name: Cache DuckDB extensions
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('packages/lake/package.json') }}

      - name: Warm DuckDB extensions
        if: steps.changes.outputs.code == 'true'
        # `@duckdb/node-api` is a dependency of @kukan/lake, not of the root.
        working-directory: packages/lake
        run: |
          node --input-type=module -e "
            const { DuckDBInstance } = await import('@duckdb/node-api')
            const conn = await (await DuckDBInstance.create(':memory:')).connect()
            await conn.run('INSTALL ducklake')
          "

      - name: Test (unit only)
        if: steps.changes.outputs.code == 'true'
        run: pnpm test:unit

      # See `lint-typecheck` for why saving is limited to develop, and why the
      # entry is pruned before it is written.
      - name: Prune turbo cache
        if: github.ref == 'refs/heads/develop'
        run: find .turbo/cache -type f -mtime +7 -delete

      - name: Save turbo cache
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-unit-${{ runner.os }}-${{ github.sha }}

  # Not part of `quality`, so it is not a required check: it needs a database,
  # and a service container failing should not block a PR the same way a lint
  # error does. It still runs on every code change, which is the point — the raw
  # SQL these suites cover (data-modifying CTEs, the orphan sweep's reference
  # check) is not exercised anywhere else.
  #
  # "Code change" excludes site/ and infra/ on top of the docs rule above:
  # nothing this job runs reaches either — @kukan/site is not in the vitest
  # workspace, and infra's synth tests are unit tests that run in `unit`.
  integration:
    runs-on: ${{ vars.CI_LARGE_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kukan
          POSTGRES_PASSWORD: kukan
          POSTGRES_DB: kukan
        ports:
          - 5432:5432
        # PGDATA on tmpfs. What costs time is the fsync behind every COMMIT,
        # and 1034 tests against a real server commit constantly. On develop
        # that took the `tests` figure vitest reports from ~98s to 48s and the
        # job from 240s to 169s; the `setup` figure did not move, so neither
        # the template copy nor the per-file truncate was the thing to point
        # at. A container thrown away at the end of the job has nothing to
        # lose by keeping its data directory in memory.
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U kukan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the PR base

      - name: Detect changes this job runs against
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          ignore: '(\.mdx?$|\.astro$|^docs/|^site/|^infra/)'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.code == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: '24'

      # See `lint-typecheck` for why the store is cached by hand rather than
      # through `cache: 'pnpm'`. This job only reads it.
      - name: Locate pnpm store
        id: pnpm-store
        if: steps.changes.outputs.code == 'true'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-integration-${{ runner.os }}-

      # The worker's suites import `@kukan/api` and `@kukan/db` by their package
      # entry points, which resolve to `dist` — so those two and their
      # dependencies are what gets built, which is about a third of the full
      # graph. `next build` used to run here too, as the one place pull request
      # CI builds @kukan/web; it kept its own job (`web-build` below) so the
      # check survives without sitting in front of the database suites.
      - if: steps.changes.outputs.code == 'true'
        run: pnpm build --filter=@kukan/api... --filter=@kukan/db...

      # POSTGRES_*, not DATABASE_URL: loadEnv assembles the one from the other
      # and never reads it directly, so setting it here said nothing. The
      # credentials have to stay in step with the service container above.
      - name: Test (integration)
        if: steps.changes.outputs.code == 'true'
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: kukan
          POSTGRES_USER: kukan
          POSTGRES_PASSWORD: kukan
        run: pnpm test:integration

      # See `lint-typecheck` for why saving is limited to develop.
      - name: Prune turbo cache
        if: github.ref == 'refs/heads/develop'
        run: find .turbo/cache -type f -mtime +7 -delete

      - name: Save turbo cache
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}

  # The one place pull request CI runs `next build`. Nothing else does —
  # deploy-site builds only @kukan/site, CodeQL is build-mode none, and the
  # Dockerfile's web target runs only in the deploy pipeline (`worker-image`
  # below builds the worker target). `tsc --noEmit` in `lint-typecheck` does
  # not stand in for it, since a Next build also rejects server/client
  # boundary violations and invalid route exports.
  #
  # It used to run inside `integration`, in front of the database suites; a job
  # of its own keeps the check and takes it off their critical path. The change
  # filter is integration's: a docs, site, or infra change cannot alter what
  # this builds. The turbo cache makes the build near-free when web and its
  # dependencies did not change.
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the PR base

      - name: Detect changes this job runs against
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          ignore: '(\.mdx?$|\.astro$|^docs/|^site/|^infra/)'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.code == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: '24'

      - name: Locate pnpm store
        id: pnpm-store
        if: steps.changes.outputs.code == 'true'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-web-${{ runner.os }}-

      - if: steps.changes.outputs.code == 'true'
        run: pnpm build --filter=@kukan/web...

      # A build that succeeds can still produce a server that cannot start —
      # Next 16.3.1's standalone output missed @swc/helpers' esm files and every
      # image built from it crashed on boot. Booting the output catches that
      # class. No env is given on purpose: reaching an HTTP response (the
      # env-validation 500 included) proves module resolution and server init
      # survived, which is everything `next build` alone does not check.
      - name: Boot-smoke the standalone output
        if: steps.changes.outputs.code == 'true'
        run: |
          cd apps/web/.next/standalone
          PORT=3999 HOSTNAME=127.0.0.1 node apps/web/server.js & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if ! kill -0 $pid 2>/dev/null; then
              echo 'boot smoke: server exited before responding'; exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 1 http://127.0.0.1:3999/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "boot smoke: HTTP $code"; exit 0
            fi
            sleep 1
          done
          echo 'boot smoke: no HTTP response within 60s'; exit 1

      # See `lint-typecheck` for why saving is limited to develop.
      - name: Prune turbo cache
        if: github.ref == 'refs/heads/develop'
        run: find .turbo/cache -type f -mtime +7 -delete

      - name: Save turbo cache
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-web-${{ runner.os }}-${{ github.sha }}

  # Build the runtime images and boot them. Twice now a worker image has crashed
  # on boot with no test having run against it: the deploy pipeline was the first
  # thing to build the Dockerfile, and the deploy circuit breaker the first thing
  # to run the result. Both times a native module's platform binary was missing —
  # DuckDB's binding, then sharp's — because the worker's `pnpm deploy
  # --no-optional` drops optional dependencies and the Dockerfile copies the ones
  # it knows about back in. `web-build`'s boot smoke would not have caught either:
  # it boots the standalone output on the runner, and the runner is glibc while
  # the image is Alpine, so what resolves there can still be missing here.
  # Building the images is the only test that runs on their own libc.
  #
  # Both targets, because both runtime stages carry hand-copied native libraries
  # (the worker's two bindings, the web's libduckdb.so) and share the edits that
  # trim the images. The targets share the `deps` and `build` stages, so the
  # second costs its own runtime stage rather than another full build.
  #
  # Not part of `quality`: a registry or network failure during a build should
  # not block a PR the way a lint error does.
  #
  # It runs on the changes that decide what lands in the images rather than on
  # every pull request: the Dockerfile, the lockfile and the manifests, and the
  # bundler config that decides what stays external. Both incidents are in that
  # list — sharp arrived as a worker dependency, DuckDB's binding the same way —
  # and so are the weekly dependency bumps, which is where a platform binary
  # moves without anyone meaning to. Measured over the last 50 commits on
  # develop, 13 touched one of these. A release is in the list too, through the
  # version line in the root package.json: it is the last moment to check what
  # is about to be tagged. What this does not cover is a new top-level import of
  # a dependency already declared — the manifests do not move, and the first
  # sign would be the deploy.
  #
  # No layer cache, deliberately. Exporting this build's layers measured 1.9 GB
  # whether or not the intermediate stages were included, against the
  # repository's 10 GB budget that the pnpm store, the turbo caches, and the
  # DuckDB extensions already share — one entry would evict the rest. The job
  # runs beside the others rather than in front of anything, so a cold build
  # costs wall clock only when it is the slowest job of the run.
  docker-images:
    runs-on: ${{ vars.CI_LARGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the PR base

      - name: Detect changes this job runs against
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          # The job's own definition is in the list: a change to how the images
          # are built or checked runs the check.
          only: '^(Dockerfile|\.dockerignore|pnpm-lock\.yaml|pnpm-workspace\.yaml|(.*/)?package\.json|apps/worker/tsup\.config\.ts|\.github/(workflows/ci\.yml|actions/detect-changes/action\.yml))$'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.code == 'true'

      - name: Build the worker image
        if: steps.changes.outputs.code == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          tags: kukan-worker:ci
          load: true

      - name: Build the web image
        if: steps.changes.outputs.code == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          tags: kukan-web:ci
          load: true

      # No env is given on purpose. The entrypoint validates its environment
      # right after its imports resolve, so stopping there proves every module —
      # native bindings included — loaded on the image's own libc, which is the
      # failure both incidents shared. A missing binary throws from the import
      # instead, and the step fails with the output attached.
      - name: Boot-smoke the worker image
        if: steps.changes.outputs.code == 'true'
        run: |
          out=$(docker run --rm kukan-worker:ci node apps/worker/dist/index.js 2>&1 || true)
          if printf '%s' "$out" | grep -q 'ZodError'; then
            echo 'boot smoke: imports resolved, stopped at env validation'; exit 0
          fi
          echo 'boot smoke: the worker did not reach env validation'
          printf '%s\n' "$out" | head -20
          exit 1

      # Same idea, one step later: the web image has no env either, so any HTTP
      # response (the env-validation 500 included) means the server resolved its
      # modules and initialised. See `web-build` for the same check against the
      # standalone output.
      - name: Boot-smoke the web image
        if: steps.changes.outputs.code == 'true'
        run: |
          docker run --rm -d --name kukan-web-ci -p 3999:3000 kukan-web:ci
          trap 'docker rm -f kukan-web-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if [ -z "$(docker ps -q -f name=kukan-web-ci)" ]; then
              echo 'boot smoke: the container exited before responding'
              docker logs kukan-web-ci 2>&1 | head -20
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 1 http://127.0.0.1:3999/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "boot smoke: HTTP $code"; exit 0
            fi
            sleep 1
          done
          echo 'boot smoke: no HTTP response within 60s'
          docker logs kukan-web-ci 2>&1 | head -20
          exit 1
