name: CI

# Lint, typecheck, format check, and unit tests run on every pull request.
#
# `quality` is a REQUIRED status check (see the branch ruleset), so the job must
# always run and report a status — using `paths-ignore` would leave the required
# check pending forever and block the PR. Instead the job always runs but skips
# the code-only steps (lint / typecheck / unit tests) for docs-only PRs. The
# format check still runs because `prettier --check` also covers Markdown and
# Astro. `.astro` files count as docs: @kukan/site has no lint/typecheck/test
# scripts, so the code-only steps never look at them anyway.

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the PR base

      - name: Detect non-docs changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A PR is "docs-only" when every changed file is Markdown/MDX/Astro or
          # under docs/. Those still need the format check (prettier covers
          # .md/.mdx/.astro) but not the code-only steps, which don't process
          # .astro at all. merge-base keeps the diff correct if base advanced.
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          files=$(git diff --name-only "$base" "$HEAD_SHA")
          echo "Changed files:"
          echo "$files"
          if printf '%s\n' "$files" | grep -qvE '(\.mdx?$|\.astro$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected — running full quality suite."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change — running format check only."
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Format check
        # No `if:` guard — prettier covers Markdown, so this runs on docs-only PRs too.
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,md,astro}"

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Test (unit only)
        # `test:unit` runs every project except the `*-integration` ones, whose
        # globalSetup connects to Postgres. Those run in `integration` below.
        if: steps.changes.outputs.code == 'true'
        run: pnpm test:unit

  # Not part of `quality`, so it is not a required check: it needs a database,
  # and a service container failing should not block a PR the same way a lint
  # error does. It still runs on every code change, which is the point — the raw
  # SQL these suites cover (data-modifying CTEs, the orphan sweep's reference
  # check) is not exercised anywhere else.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kukan
          POSTGRES_PASSWORD: kukan
          POSTGRES_DB: kukan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kukan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The worker's suites import `@kukan/api` and `@kukan/db` by their package
      # entry points, which resolve to `dist`.
      - run: pnpm build

      - name: Test (integration)
        env:
          DATABASE_URL: postgresql://kukan:kukan@localhost:5432/kukan
        run: pnpm test:integration
