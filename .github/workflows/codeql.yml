name: CodeQL

# Static analysis (SAST) for the TypeScript/JavaScript sources. Runs on pushes
# and PRs to the default branch plus a weekly schedule so newly disclosed query
# patterns catch existing code. build-mode 'none' suits an interpreted stack —
# no compilation step is required for JS/TS analysis.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '27 3 * * 1' # weekly, Monday 03:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # Code scanning upload is free on public repos but needs GitHub Advanced
    # Security (paid) on the private source. Run only on the public mirror, the
    # same guard deploy-site.yml uses. Private PRs skip this job.
    if: github.repository == 'kukan-project/kukan'
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: '/language:javascript-typescript'
