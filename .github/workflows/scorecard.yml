name: Scorecard

# OpenSSF Scorecard supply-chain analysis. Publishes results to the public
# OpenSSF dataset (which serves the README badge) and uploads SARIF to code
# scanning. Runs only on the public mirror: publish_results requires a public
# repo, so the private source would fail the publish step — the same guard
# codeql.yml and deploy-site.yml use.

on:
  branch_protection_rule:
  schedule:
    - cron: '31 4 * * 1' # weekly, Monday 04:31 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'kukan-project/kukan'
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish results to the OpenSSF dataset
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
