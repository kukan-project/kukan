name: Build an image
description: >-
  `docker buildx build` of the repository's Dockerfile, its base images pulled
  from Google's Docker Hub mirror, tried three times.

inputs:
  name:
    description: What is built, for the retry warning.
    required: true
  options:
    description: The `docker buildx build` arguments before the context (`.`).
    required: true

runs:
  using: composite
  steps:
    # The base image is on ECR Public so that CodeBuild escapes Docker Hub's
    # pull limit, but ECR Public meters anonymous pulls by source IP, and a
    # hosted runner shares its IP with other people's jobs: the pull fails
    # with `429 Data limit exceeded` whatever this repository pulled. Here the
    # same digest comes from Google's Docker Hub mirror instead. The digest
    # pins the content, so the image is still the one the Dockerfile names.
    #
    # The mirror answers `not found` for a layer it has not cached yet, and
    # serves it moments later, so a build is tried three times. The stages
    # that finished stay in the builder's cache, so a retry redoes little.
    - shell: bash
      env:
        NAME: ${{ inputs.name }}
        OPTIONS: ${{ inputs.options }}
      run: |
        contexts=()
        for ref in $(sed -nE 's/^FROM (--platform=[^ ]+ )?(public\.ecr\.aws\/docker\/library\/[^ ]+@sha256:[0-9a-f]+).*/\2/p' Dockerfile | sort -u); do
          name=${ref#public.ecr.aws/docker/library/}
          contexts+=(--build-context "$ref=docker-image://mirror.gcr.io/library/${name%%[:@]*}@${ref#*@}")
        done
        read -ra options <<< "$OPTIONS"
        for attempt in 1 2 3; do
          docker buildx build "${contexts[@]}" "${options[@]}" . && exit 0
          [ "$attempt" = 3 ] && exit 1
          echo "::warning::build of $NAME failed, retrying"
          sleep 10
        done
