# ゴールデンセット — 検索品質評価用の「クエリ → 正解データセット」ペア
#
# このファイルは記入ガイド付きのテンプレートです。環境ごとの実データは
#   cd packages/api/scripts && cp golden-queries.example.yaml golden-queries.yaml
# で作成してください（golden-queries.yaml は .gitignore 対象 — カタログの中身は
# デプロイ環境ごとに異なるため、リポジトリにはコミットしません）。
#
# 実行: pnpm eval:search（対象環境は -- --base で指定、既定 http://localhost:3000）
# 計測: Recall@10 / nDCG@10 を semantic ON / OFF で比較（同ディレクトリの eval-search.ts）
#
# 記入ガイド（ADR-034 §5 / docs/specs/phase5-vector-search.md §9）:
# - 20〜50 問を目標に、実データを知る人が「利用者が実際に打ちそうなクエリ」を起こす
# - type は 3 種を必ず混在させる:
#     synonym : 語彙が一致しない言い換え（ベクトル検索の効果測定）
#     natural : 自然文・質問形（同上）
#     exact   : データセット名・固有名詞そのまま（劣化検知用 — hybrid で
#               キーワード検索より悪化しないことが出荷条件）
# - relevant にはデータセットの name（URL 識別子）を列挙する。
#   「上位10件に入っているべきもの」であり、全網羅である必要はない
# - モデル・しきい値・RRF 重みの変更時は必ずこのセットで前後比較する
#
# 以下は東京都オープンデータを投入した環境での記入例（name は環境ごとに異なる）:

queries:
  - query: 無料Wi-Fiが使える場所
    type: synonym
    relevant:
      - t000029d0000000025 # 公衆無線LANアクセスポイント一覧

  - query: 汚水はどうやって処理されている?
    type: natural
    relevant:
      - t000020d0000000017 # 下水処理の状況（区部及流域）（令和4年度）
      - t000020d0000000087 # 下水処理の状況（区部及流域）（令和3年度）

  - query: 教育人口等推計
    type: exact
    relevant:
      - t000021d2000000189 # 教育人口等推計
