name: kukan

x-minio-credentials: &minio-credentials
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

# ---------- Shared app environment (prod profile) ----------
x-app-environment: &app-environment
  NODE_ENV: production
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-kukan}
  POSTGRES_USER: ${POSTGRES_USER:-kukan}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kukan}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-kukan-dev}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
  SEARCH_TYPE: ${SEARCH_TYPE:-opensearch}
  OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
  SQS_ENDPOINT: ${SQS_ENDPOINT:-http://elasticmq:9324}
  SQS_QUEUE_URL: ${SQS_QUEUE_URL:-http://elasticmq:9324/000000000000/kukan-pipeline}
  SQS_ACCESS_KEY: ${SQS_ACCESS_KEY:-x}
  SQS_SECRET_KEY: ${SQS_SECRET_KEY:-x}
  AI_TYPE: ${AI_TYPE:-none}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}

services:
  # ===== Infrastructure (always started) =====

  postgres:
    # pgvector-bundled image (Debian-based). Migrating an existing alpine pgdata
    # volume changes the collation implementation — recreate the volume in dev,
    # or pg_dump/restore (or REINDEX) in production. See ADR-034.
    image: pgvector/pgvector:pg16
    container_name: kukan-postgres
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kukan}
      POSTGRES_USER: ${POSTGRES_USER:-kukan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kukan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: kukan-minio
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      <<: *minio-credentials
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: kukan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-credentials
      S3_BUCKET: ${S3_BUCKET:-kukan-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: kukan-elasticmq
    ports:
      - '127.0.0.1:9324:9324'
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf
    healthcheck:
      # Probe the SQS REST API on 9324 (the only port elasticmq.conf serves);
      # ListQueues returns HTTP 200 so wget exits 0 once the queue is ready.
      test:
        [
          'CMD-SHELL',
          "wget -qO- 'http://localhost:9324/?Action=ListQueues&Version=2012-11-05' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    build:
      context: ./docker
      dockerfile: opensearch.Dockerfile
    image: kukan-opensearch:3
    container_name: kukan-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      # Heap default 2g: an OpenSearch 3.x node idles at ~430MB heap (plugins
      # included, index data lives off-heap), so 512m sat at the 95% circuit
      # breaker and failed searches under load. Override via OPENSEARCH_JAVA_OPTS.
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: kukan-opensearch-dashboards
    ports:
      - '127.0.0.1:5601:5601'
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy

  # ===== Production stack (--profile prod) =====

  ollama:
    # Embedding model server (ADR-034). Same configuration for dev and on-prem;
    # closed networks pre-distribute the ollama-models volume instead of `ollama pull`.
    # Setup: docker compose --profile ai up -d && docker compose exec ollama ollama pull bge-m3
    # Host port defaults to 11435 (not 11434) so a natively installed Ollama
    # doesn't collide; in-network services still use http://ollama:11434.
    image: ollama/ollama:latest
    container_name: kukan-ollama
    profiles: [ai]
    environment:
      # Keep models loaded. The default (5m) unloads the embedding model on
      # idle, so the first search afterwards exceeds the 2s embed timeout and
      # silently degrades to keyword-only.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
    ports:
      - '127.0.0.1:${OLLAMA_PORT:-11435}:11434'
    volumes:
      - ollama-models:/root/.ollama

  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: kukan-web:latest
    container_name: kukan-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
    environment:
      <<: *app-environment
      PORT: '3000'
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: kukan-worker:latest
    container_name: kukan-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
    environment:
      <<: *app-environment
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    profiles: [prod]
    image: caddy:2-alpine
    container_name: kukan-caddy
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  opensearch-data:
  ollama-models:
  caddy-data:
  caddy-config:
